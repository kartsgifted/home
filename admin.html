<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta name="robots" content="noindex, nofollow"/>
<title>게시글 관리 | 2026 K예술영재 프로젝트</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<link href="assets/css/common.css" rel="stylesheet"/>
<link href="assets/css/admin.css" rel="stylesheet"/>
</head>
<body class="admin">
<header class="ad-top">
  <div class="ad-in">
    <p class="ad-logo">K예술영재 홍보 사이트 <b>게시글 관리</b></p>
    <div class="ad-user" id="user" hidden>
      <span id="who"></span>
      <a href="index.html" target="_blank" rel="noopener">사이트 보기 ↗</a>
      <button type="button" id="logout">로그아웃</button>
    </div>
  </div>
</header>
<div class="ad-pub" id="pub" hidden></div>
<main class="ad-in" id="view"></main>

<!-- 로그인 (처음 들어올 때, 그리고 사용 중 로그인이 만료됐을 때 작업 화면 위에 띄운다) -->
<div class="ad-modal" id="login" hidden>
  <form class="ad-login" id="loginForm" autocomplete="off">
    <h1>게시글 관리 로그인</h1>
    <p class="sub" id="loginSub">운영진 접근코드와 이름을 입력해 주세요.</p>
    <label>접근코드<input id="code" type="password" required autocomplete="off" spellcheck="false"/></label>
    <label>이름<input id="name" type="text" required maxlength="20" placeholder="작성자로 기록됩니다"/></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button type="submit" class="ad-btn pri" id="loginBtn">로그인</button>
  </form>
</div>

<div class="ad-busy" id="busy" hidden><div><i></i><p id="busyMsg"></p></div></div>
<div class="ad-toast" id="toast" role="status"></div>

<script src="assets/js/board.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
